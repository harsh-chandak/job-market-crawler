# Sample bullet bank.
# The real one is private. This keeps the schema so the pipeline and its
# tests run end to end, with placeholder content in place of a real record.
# Replace every value here with your own before using it for anything.

# Resume bullet bank.
#
# APPROVED STRINGS. The tailoring stage selects and orders them; it never writes
# new prose, and src/tailor.js refuses any rendered bullet not present here
# byte-for-byte. That is the whole safety model: a fabricated employer, date or
# metric on an application is a real problem, worse during a visa process, so it
# is enforced in code rather than requested in a prompt.
#
# Curated 2026-09-10 for SDE / AI engineering roles only. Forward-deployed
# engineering was dropped (most of those teams do not sponsor), and the pool was
# cut from 53 bullets to the strongest 25 so selection chooses between good
# options instead of padding. Every bullet is ONE line at the resume's size
# (check with scripts/check-wrap.mjs) and carries a `# source:` line; every
# number was checked against it. Example Corp's matching v2 ran on dev ahead of the
# Oct 27 public launch, so those bullets claim what was built and measured, not
# what students saw.
#
# `max_bullets` is each role's weight on the page: the current role carries the
# most. The renderer enforces it and the selector is shown it.

# One project on the page. The selector gives the slot to whichever fits the
# posting; the crawler by default, Kafka for a streaming-heavy role.
render:
  max_projects: 1
  # A second project is added only when the page still fits at 10pt or larger
  # with nothing trimmed (renderPdf). Otherwise the page shows one.
  fill_projects: 2
  # A project on the page carries at least three bullets, or it is not shown.
  min_project_bullets: 3

